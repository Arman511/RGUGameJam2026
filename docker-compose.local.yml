services:
  elemental-api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ELEMENTAL_API_DB_PATH: /data/elemental_api.db
      ELEMENTAL_API_ADMIN_TOKEN: ${ELEMENTAL_API_ADMIN_TOKEN:-}
      ELEMENTAL_MATCH_LIMIT: ${ELEMENTAL_MATCH_LIMIT:-100}
      ELEMENTAL_MATCH_JOIN_TIMEOUT_SECONDS: ${ELEMENTAL_MATCH_JOIN_TIMEOUT_SECONDS:-120}
    volumes:
      - ./.local/elemental_api_data:/data
    env_file:
      - .env

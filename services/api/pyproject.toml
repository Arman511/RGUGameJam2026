[project]
name = "elemental-api"
version = "0.1.0"
description = "FastAPI service for Elemental Keep"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "argon2-cffi>=23.0.0",
    "sqlalchemy>=2.1.6",
    "alembic>=1.14.0",
    "jinja2>=3.1.6",
]


[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

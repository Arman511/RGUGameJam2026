<!doctype html>
<html lang="en" data-bs-theme="dark">

<head>
  {% include "seo.html" %}
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="{{ url_for('static', path='css/leaderboard.css') }}" rel="stylesheet">
  <script src="{{ url_for('static', path='js/theme.js') }}" defer></script>
  <script src="{{ url_for('static', path='js/register.js') }}" defer></script>
</head>

<body>
  <main class="container-xl page-shell py-4 py-lg-5">
    <header class="d-flex align-items-center justify-content-between gap-3 mb-5">
      <a class="brand d-flex align-items-center gap-2 text-decoration-none" href="/">
        <img class="brand-mark d-inline-grid place-items-center" aria-hidden="true"
          src="{{ url_for('static', path='icon.png') }}" alt="Brand mark">
        <span class="fw-bold small letter-spaced">ELEMENTAL KEEP</span>
      </a>
      <div class="d-flex align-items-center gap-2">
        <a class="btn btn-outline-secondary" href="/download">Download</a>
        <a class="btn btn-outline-secondary" href="/">Back to leaderboard</a>
        <button class="btn btn-outline-secondary theme-toggle d-inline-flex align-items-center gap-2" id="theme-toggle"
          type="button" aria-label="Switch to light mode" aria-pressed="false">
          <span id="theme-icon" aria-hidden="true">☀</span>
          <span id="theme-label" class="d-none d-sm-inline">Light mode</span>
        </button>
      </div>
    </header>

    <section class="auth-card mx-auto" aria-labelledby="page-heading">
      <p class="eyebrow mb-3">Join the keepers</p>
      <h1 class="h2 fw-bold mb-2" id="page-heading">Create your account</h1>
      <p class="auth-description mb-4">
        Choose a username and password to join the leaderboard.
      </p>

      <form id="register-form">
        <div class="mb-3">
          <label class="form-label" for="username">Username</label>
          <input class="form-control" id="username" name="username" type="text" minlength="3" maxlength="32"
            autocomplete="username" autocapitalize="none" spellcheck="false" required>
          <div class="form-text">Use 3 to 32 characters.</div>
        </div>

        <div class="mb-3">
          <label class="form-label" for="password">Password</label>
          <input class="form-control" id="password" name="password" type="password" minlength="8" maxlength="128"
            autocomplete="new-password" required>
          <div class="form-text">
            Use 8 to 128 characters, including uppercase and lowercase letters, a number, and a symbol.
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label" for="confirm-password">Confirm password</label>
          <input class="form-control" id="confirm-password" name="confirm-password" type="password" minlength="8"
            maxlength="128" autocomplete="new-password" required>
        </div>

        <p class="auth-message mb-3" id="form-message" role="status" aria-live="polite" hidden></p>
        <button class="btn btn-primary w-100" id="register-button" type="submit">
          Create account
        </button>
      </form>
    </section>
  </main>
</body>

</html>

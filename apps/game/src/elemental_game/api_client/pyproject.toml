[project]
name = "api-client"
version = "0.1.0"
description = "HTTP client for the Elemental Keep API"
requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx>=0.27.0",
    "keyring>=25.0.0",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

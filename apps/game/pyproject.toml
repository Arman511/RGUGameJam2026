[project]
name = "elemental-game"
version = "0.1.0"
description = "Desktop game for Elemental Keep"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pygame>=2.6.0; platform_machine != 'ARM64'",
    "pygame-ce>=2.5.8; platform_machine == 'ARM64'",
    "alembic>=1.14.0",
    "httpx>=0.27.0",
    "keyring>=25.0.0",
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0",
]


[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

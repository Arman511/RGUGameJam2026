[project]
dependencies = [
  "pygame>=2.6.0; platform_machine != 'ARM64'",
  "pygame-ce>=2.5.8; platform_machine == 'ARM64'",
  "httpx>=0.27.0",
  "keyring>=25.0.0",
  "pydantic>=2.0.0",
  "sqlalchemy>=2.0.0",
  "websockets>=14.0",
  "python-dotenv>=1.2.4",
]
description = "Desktop game for Elemental Keep"
name = "elemental-game"
requires-python = ">=3.12,<3.14"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling>=1.18.0"]
